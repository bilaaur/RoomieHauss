<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoomiE Haus Landing Page</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css') }}">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <img src="{{ url_for('static', filename='photo/Logo.png') }}" alt="Logo">
    </div>
    <div class="exit-icon">
      <a href="/logout">
        <img src="{{ url_for('static', filename='photo/Logout.png') }}" alt="Logout">
      </a>
    </div>
  </header>

  <div class="main-content">
    <div class="house-image">
      <model-viewer
        src="{{ url_for('static', filename='model/house.glb') }}"
        alt="3D House"
        auto-rotate
        camera-controls
        ar
        ar-modes="webxr scene-viewer quick-look"
        shadow-intensity="1"
        exposure="0.75">
      </model-viewer>
    </div>

    <div class="text-content">
      <p class="welcome">Welcome, {{ partner1 }} &amp; {{ partner2 }}!</p>
      <p>
        RoomieHaus is a 3D interactive roommate budgeting web application
        that allows two users to manage and visualize their monthly finances together.
      </p>
      <div class="get-inside">
        <button onclick="window.location.href='/inside-page'">
          GET INSIDE
          <img src="{{ url_for('static', filename='photo/touch.png') }}" alt="Touch">
        </button>
      </div>
    </div>
  </div>
</body>
</html>
